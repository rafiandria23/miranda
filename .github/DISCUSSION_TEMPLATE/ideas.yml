title: "[Idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this for open-ended ideas or direction you'd like to discuss
        before it's concrete enough for a feature request. If you already
        have a specific, actionable proposal, consider filing a ✨ Feature
        request issue instead. Please skim `MIRANDA_ROADMAP.md` first —
        it may already be planned.

  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: What's the use case or problem this addresses?
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions / tradeoffs
      description: Anything you're unsure about, or design decisions worth discussing.
    validations:
      required: false
