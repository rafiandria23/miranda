title: "[Q&A] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Have a usage question that isn't a bug or feature request? Ask here.
        For actual bugs, please use the 🐛 Bug report issue template instead.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: What outcome are you after, and what have you tried so far?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Embedded (miranda-cli run)
        - Distributed - single control plane
        - Distributed - high availability (multiple control planes)
        - Not applicable
    validations:
      required: false

  - type: dropdown
    id: backend
    attributes:
      label: Storage backend
      options:
        - SQLite
        - Postgres
        - MySQL
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Relevant config, workflow YAML, or logs
      render: shell
    validations:
      required: false
