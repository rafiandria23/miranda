name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

env:
  CARGO_TERM_COLOR: always
  MYSQL_USER: rafiandria23
  MYSQL_PASSWORD: rafiandria23
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_DB: miranda
  POSTGRES_USER: rafiandria23
  POSTGRES_PASSWORD: rafiandria23
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  POSTGRES_DB: miranda
  DATABASE_URL_MYSQL: mysql://rafiandria23:rafiandria23@127.0.0.1:3306/miranda
  DATABASE_URL_POSTGRES: postgres://rafiandria23:rafiandria23@127.0.0.1:5432/miranda
  DATABASE_URL_SQLITE: sqlite://${{ github.workspace }}/crates/storage-sqlite/miranda.sqlite?mode=rwc

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  sqlx-prepare-check:
    name: sqlx prepare check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9-oracle
        env:
          MYSQL_ROOT_PASSWORD: rafiandria23
          MYSQL_USER: rafiandria23
          MYSQL_PASSWORD: rafiandria23
          MYSQL_DATABASE: miranda
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -urafiandria23 -prafiandria23"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rafiandria23
          POSTGRES_PASSWORD: rafiandria23
          POSTGRES_DB: miranda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,mysql,postgres,sqlite --locked
      - name: Run migrations
        run: make db-migrate-all
      - name: Check sqlx offline query cache is in sync
        run: |
          (cd crates/storage-mysql && DATABASE_URL="$DATABASE_URL_MYSQL" cargo sqlx prepare --check)
          (cd crates/storage-postgres && DATABASE_URL="$DATABASE_URL_POSTGRES" cargo sqlx prepare --check)
          (cd crates/storage-sqlite && DATABASE_URL="$DATABASE_URL_SQLITE" cargo sqlx prepare --check)

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9-oracle
        env:
          MYSQL_ROOT_PASSWORD: rafiandria23
          MYSQL_USER: rafiandria23
          MYSQL_PASSWORD: rafiandria23
          MYSQL_DATABASE: miranda
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -urafiandria23 -prafiandria23"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rafiandria23
          POSTGRES_PASSWORD: rafiandria23
          POSTGRES_DB: miranda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,mysql,postgres,sqlite --locked
      - name: Run migrations
        run: make db-migrate-all
      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  coverage:
    name: Codecov
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lcov
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sonarcloud:
    name: SonarCloud
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: lcov
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build
    needs:
      - fmt
      - clippy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --workspace --all-features --release
