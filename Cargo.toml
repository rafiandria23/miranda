[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/core",
  "crates/runtime",
  "crates/server",
  "crates/storage",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = [ "derive" ] }
thiserror = { version = "2.0.19" }
tokio = { version = "1.53.1", features = [ "full" ] }
tracing = { version = "0.1.44" }
uuid = { version = "1.24.0", features = [ "v7" ] }
