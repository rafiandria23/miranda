[package]
name = "miranda-server"
version = "0.1.0"
edition = "2024"

[dependencies]
miranda-core = { path = "../core" }
miranda-runtime = { path = "../runtime" }

tokio = { workspace = true }
tracing = { workspace = true }

axum = { version = "0.8.9" }
tonic = { version = "0.14.6" }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "postgresql" ] }
